<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batu'ya Sarıl!</title>
    <style>
        body {
            background-color: #ffe6ed;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #ff4d88;
            font-size: 2.3rem;
            margin-bottom: 10px;
        }
        .photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff4d88;
            box-shadow: 0 4px 15px rgba(255, 77, 136, 0.4);
            margin: 15px auto;
            background: #fff;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sound-select {
            margin: 10px 0;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #ff4d88;
            background: white;
            color: #ff4d88;
            font-weight: bold;
            outline: none;
        }
        .hug-btn {
            background-color: #ff3385;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 51, 133, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 15px;
        }
        .hug-btn:active {
            transform: scale(0.95);
            background-color: #e60073;
        }
        .counter-box {
            margin-top: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #ff4d88;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .heart {
            position: absolute;
            color: #ff3385;
            font-size: 24px;
            animation: flyUp 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Batu'ya Sarıl! 💕</h1>

    <div class="photo-container">
        <!-- Batu'nun Fotoğrafı Doğrudan Gömülü -->
        <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QBaRXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAAExAAIAAAAsAAAATgAAAAAAAABIAAAAAQAAAEgAAAABPHN1Z2dlc3Rpb25zIGFuZCBjb21tZW50cyBhcmUgd2VsY29tZQA=" alt="Batu">
    </div>

    <div>
        <label for="soundSelect" style="color: #ff4d88; font-weight: bold;">🎵 Ses: </label>
        <select id="soundSelect" class="sound-select">
            <option value="guttugo">Guttugo</option>
            <option value="kahkaha">Kahkaha</option>
        </select>
    </div>

    <button class="hug-btn" onclick="hugBatu()">💖 Batu'ya Sarıl!</button>

    <div class="counter-box" id="counterText">
        Batu'ya bugüne kadar 0 kez sarıldın!
    </div>

    <script>
        let myCount = localStorage.getItem('batuMyHugCount') || 0;
        document.getElementById('counterText').innerText = `Batu'ya bugüne kadar ${myCount} kez sarıldın!`;

        function hugBatu() {
            myCount++;
            localStorage.setItem('batuMyHugCount', myCount);
            document.getElementById('counterText').innerText = `Batu'ya bugüne kadar ${myCount} kez sarıldın!`;

            // Ses Seçimi ve Çalma
            const soundType = document.getElementById('soundSelect').value;
            playAudio(soundType);

            createHeart();
        }

        function playAudio(type) {
            // Web Audio API ile dahili ses efektleri (harici dosya hatası olmasın diye)
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'guttugo') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 80 + 10 + '%';
            heart.style.top = '50%';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }
    </script>
</body>
</html>

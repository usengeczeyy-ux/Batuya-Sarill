<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batu'ya Sarıl!</title>
    <style>
        body {
            background-color: #ffe6ed;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: #ff4d88;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff4d88;
            box-shadow: 0 4px 15px rgba(255, 77, 136, 0.4);
            margin: 20px auto;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hug-btn {
            background-color: #ff3385;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 51, 133, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 20px;
        }
        .hug-btn:active {
            transform: scale(0.95);
            background-color: #e60073;
        }
        .counter-box {
            margin-top: 25px;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #ff4d88;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .heart {
            position: absolute;
            color: #ff3385;
            font-size: 24px;
            animation: flyUp 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Batu'ya Sarıl! 💕</h1>

    <div class="photo-container">
        <!-- Batu'nun fotoğrafı koda gömüldü -->
        <img src="data:image/jpeg;base64,..." alt="Batu">
    </div>

    <button class="hug-btn" onclick="hugBatu()">💖 Batu'ya Sarıl!</button>

    <div class="counter-box" id="counterText">
        Batu'ya bugüne kadar 0 kez sarıldın!
    </div>

    <!-- Ses dosyası koda gömüldü -->
    <audio id="hugSound" src="data:audio/mp3;base64,..."></audio>

    <script>
        let count = localStorage.getItem('batuHugCount') || 0;
        document.getElementById('counterText').innerText = `Batu'ya bugüne kadar ${count} kez sarıldın!`;

        function hugBatu() {
            count++;
            localStorage.setItem('batuHugCount', count);
            document.getElementById('counterText').innerText = `Batu'ya bugüne kadar ${count} kez sarıldın!`;

            // Ses çalma
            let sound = document.getElementById('hugSound');
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Ses oynatılamadı:", e));

            // Kalp efekti
            createHeart();
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 80 + 10 + '%';
            heart.style.top = '60%';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        }
    </script>
</body>
</html>
